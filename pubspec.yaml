name: spare_shop
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  dio: ^5.2.1
  socket_io_client: ^2.0.3
  shared_preferences: ^2.2.0
  image_picker: ^1.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  path_provider: ^2.1.6
  pdf: ^3.11.1
  open_filex: ^4.7.0

dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3
  golden_toolkit: ^0.15.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#12251D"
  web:
    generate: true
    image_path: "assets/images/logo_icon.png"
    background_color: "#12251D"
    theme_color: "#00E676"
  adaptive_icon_background: "#12251D"
  adaptive_icon_foreground: "assets/images/logo_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/splash_logo.png"
  android: true
  ios: true
  web: true
  android_12:
    image: "assets/images/splash_android12.png"
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
